name: cs2-remote-esp

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: cs2-remote-esp-relay:latest
    container_name: cs2-remote-esp-relay
    restart: unless-stopped
    init: true
    stop_grace_period: 5s

    ports:
      - "${PORT:-8080}:8080"

    environment:
      PORT: 8080
      BIND: 0.0.0.0
      MAX_VIEWERS: "${MAX_VIEWERS:-8}"
      HOST_TIMEOUT_MS: "${HOST_TIMEOUT_MS:-3000}"
      HELLO_TIMEOUT_MS: "${HELLO_TIMEOUT_MS:-5000}"
      ROOM_IDLE_MS: "${ROOM_IDLE_MS:-600000}"
      MAX_FRAME_BYTES: "${MAX_FRAME_BYTES:-65536}"
      # TLS: mount certificates and uncomment.
      # TLS_CERT: /certs/fullchain.pem
      # TLS_KEY: /certs/privkey.pem

    # volumes:
    #   - ./certs:/certs:ro

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
