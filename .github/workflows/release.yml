name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: pre-release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution
        run: msbuild cs2-external-esp.sln /p:Configuration=Release

      - name: Prepare artifacts
        run: |
          mkdir release
          xcopy x64\Release\* release\ /E /I /Y
          copy README.md release\README.md
          copy LICENSE release\LICENSE
          mkdir release\scripts
          copy assets\themes\themes.sl release\scripts\themes.sl

      - name: Archive artifacts
        run: |
          powershell Compress-Archive -Path release\* -DestinationPath release.zip

      - name: Download verified viewer builds
        uses: actions/download-artifact@v4
        with:
          pattern: viewer-*
          path: verified-viewers
          merge-multiple: true

      - name: Generate tag
        id: tag
        run: |
          [xml]$manifest = Get-Content viewer/assets/windows.manifest
          $version = $manifest.assembly.assemblyIdentity.version
          if ($version -notmatch '^\d+\.\d+\.\d+\.0$') { throw "Invalid viewer version $version" }
          $version = $version.Substring(0, $version.Length - 2)
          echo "tag=v$version" >> $env:GITHUB_OUTPUT
          if ("${{ inputs.release_type }}" -eq "pre-release") {
            echo "name=CS2 Remote ESP v$version Preview" >> $env:GITHUB_OUTPUT
          } else {
            echo "name=CS2 Remote ESP v$version" >> $env:GITHUB_OUTPUT
          }

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          $tag = '${{ steps.tag.outputs.tag }}'
          $existing = git rev-parse --verify "refs/tags/$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne (git rev-parse HEAD)) { throw "$tag belongs to another commit" }
          } else {
            git tag $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create $tag" }
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push $tag" }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag (before the one we just created)
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="${{ steps.tag.outputs.tag }}" 2>/dev/null || echo "$(git rev-list --max-parents=0 HEAD)")
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          RUN_ID="${{ github.run_id }}"
          
          echo "# Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Viewer tests ran on Windows x64 and macOS arm64. Relay integration and C++ protocol/camera/endpoint tests passed for this commit." >> CHANGELOG.md
          echo "GeForce NOW gameplay alignment, fullscreen and multi-monitor runtime remain pending validation. Mac viewer is ad-hoc signed and Windows executables are unsigned." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📋 Overview" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "This build was generated from commit $GITHUB_SHA by the repository release workflow after verification passed." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "> ⚠️ **This is a preview build.** We encourage you to build it yourself from the source code to ensure integrity and transparency." >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📦 Artifacts" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**[Generated artifacts](https://github.com/$REPO_OWNER/$REPO_NAME/actions/runs/$RUN_ID)**" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📝 Changes since $LAST_TAG" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $LAST_TAG..HEAD --pretty=format:"- %h: %s" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "---" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### ℹ️ Build Information" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "- **Workflow:** release.yml" >> CHANGELOG.md
          echo "- **Source:** [Repository](https://github.com/$REPO_OWNER/$REPO_NAME)" >> CHANGELOG.md
          echo "- **Build ID:** `$RUN_ID`" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body_path: CHANGELOG.md
          files: |
            release.zip
            verified-viewers/*
          fail_on_unmatched_files: true
          prerelease: ${{ inputs.release_type == 'pre-release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
